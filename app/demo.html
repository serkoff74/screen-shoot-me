<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Snapmark demo target</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#e9eef5;color:#26364d;font:14px Inter,system-ui,sans-serif}.nav{height:64px;background:#fff;display:flex;align-items:center;padding:0 56px;gap:18px}.logo{width:26px;height:26px;border-radius:8px;background:#3b82f6}.brand{font-weight:750;font-size:17px}.links{margin-left:auto;display:flex;gap:28px;color:#64748b}.hero{padding:56px;max-width:1120px;margin:auto}h1{font-size:38px;margin:0 0 12px}.lead{color:#64748b;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:42px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:26px;min-height:260px;box-shadow:0 8px 28px rgba(30,41,59,.06)}.card h2{margin:0 0 18px}.row{height:11px;background:#e5eaf1;border-radius:6px;margin:12px 0}.row.short{width:70%}.button{display:inline-flex;margin-top:26px;background:#3b82f6;color:white;border-radius:8px;padding:12px 22px;font-weight:650}.danger{position:relative}.badge{position:absolute;right:-12px;top:-12px;background:#ff4d2e;color:white;border-radius:99px;padding:4px 8px;font-size:11px}
    </style>
  </head>
  <body>
    <div class="nav"><div class="logo"></div><div class="brand">Acme Dashboard</div><div class="links"><span>Обзор</span><span>Отчёты</span><span>Команда</span></div></div>
    <main class="hero"><h1>Ваши проекты</h1><div class="lead">Проверьте статус задач и отправьте отчёт.</div><div class="grid">
      <section class="card"><h2>Маркетинговый сайт</h2><div class="row"></div><div class="row short"></div><div class="row"></div><div class="button">Открыть</div></section>
      <section class="card"><h2>Мобильное приложение</h2><div class="row"></div><div class="row"></div><div class="row short"></div><div class="button danger">Отправить<div class="badge">2</div></div></section>
    </div></main>
  </body>
</html>
