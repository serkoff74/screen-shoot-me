<svg viewBox="0 0 640 430" width="1280" height="860" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D85A30"/></marker></defs>
<rect width="640" height="430" fill="#ffffff"/>
<g transform="translate(10,10)">
<rect x="0" y="0" width="300" height="200" rx="8" fill="#ffffff" stroke="#D3D1C7"/>
<text x="12" y="20" font-size="12" fill="#5F5E5A">1. Стрелка с подписью (A)</text>
<rect x="190" y="120" width="90" height="30" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
<line x1="60" y1="70" x2="185" y2="130" stroke="#D85A30" stroke-width="3" marker-end="url(#ah2)"/>
<rect x="14" y="52" width="118" height="26" rx="13" fill="#ffffff" stroke="#D85A30" stroke-width="2" stroke-dasharray="4 3"/>
<text x="24" y="70" font-size="12" fill="#993C1D">Тут пусто</text>
<line x1="90" y1="58" x2="90" y2="72" stroke="#993C1D" stroke-width="1.5"/>
<text x="12" y="188" font-size="11" fill="#888780">тянем → отпустили → печатаем, Esc = без текста</text>
</g>
<g transform="translate(330,10)">
<rect x="0" y="0" width="300" height="200" rx="8" fill="#ffffff" stroke="#D3D1C7"/>
<text x="12" y="20" font-size="12" fill="#5F5E5A">2. Овал + комментарий (O)</text>
<rect x="40" y="110" width="100" height="32" rx="6" fill="#378ADD"/>
<text x="90" y="131" text-anchor="middle" font-size="12" fill="#ffffff">Отправить</text>
<ellipse cx="90" cy="126" rx="66" ry="28" fill="none" stroke="#D85A30" stroke-width="3"/>
<line x1="145" y1="108" x2="175" y2="78" stroke="#D85A30" stroke-width="2"/>
<rect x="175" y="62" width="112" height="26" rx="13" fill="#D85A30"/>
<text x="231" y="79" text-anchor="middle" font-size="12" fill="#ffffff">Двойная отправка</text>
<text x="12" y="188" font-size="11" fill="#888780">подпись тащится мышью, выноска следует за ней</text>
</g>
<g transform="translate(10,220)">
<rect x="0" y="0" width="300" height="200" rx="8" fill="#ffffff" stroke="#D3D1C7"/>
<text x="12" y="20" font-size="12" fill="#5F5E5A">3. Прямоугольник + комментарий (R)</text>
<rect x="30" y="80" width="240" height="14" rx="3" fill="#F1EFE8"/><rect x="30" y="102" width="200" height="14" rx="3" fill="#F1EFE8"/><rect x="30" y="124" width="220" height="14" rx="3" fill="#F1EFE8"/>
<rect x="22" y="72" width="256" height="74" rx="4" fill="none" stroke="#D85A30" stroke-width="3"/>
<rect x="22" y="48" width="150" height="24" rx="4" fill="#D85A30"/>
<text x="97" y="64" text-anchor="middle" font-size="12" fill="#ffffff">Список не обновился</text>
<text x="12" y="188" font-size="11" fill="#888780">ярлык «прилипает» к рамке, автоперенос при нехватке места</text>
</g>
<g transform="translate(330,220)">
<rect x="0" y="0" width="300" height="200" rx="8" fill="#ffffff" stroke="#D3D1C7"/>
<text x="12" y="20" font-size="12" fill="#5F5E5A">4. Карандаш + комментарий (P)</text>
<rect x="60" y="70" width="180" height="60" rx="6" fill="#F1EFE8"/>
<path d="M50 140 C 40 80, 120 55, 180 70 S 260 120, 230 145 S 90 160, 55 138" fill="none" stroke="#D85A30" stroke-width="3" stroke-linecap="round"/>
<line x1="230" y1="145" x2="248" y2="160" stroke="#D85A30" stroke-width="2"/>
<rect x="200" y="160" width="90" height="26" rx="13" fill="#D85A30"/>
<text x="245" y="177" text-anchor="middle" font-size="12" fill="#ffffff">Съехало</text>
</g>
</svg>
